services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nagi_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${NAGI_DEV_DB_PORT:-5433}:5432"
    volumes:
      - nagi_dev_postgres:/var/lib/postgresql/data
      - ./packages/database/dev/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nagi_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  nagi_dev_postgres:
